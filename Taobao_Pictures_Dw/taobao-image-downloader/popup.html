<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-main: #ffffff;
      --bg-card: #f8fafc;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #9ca3af;
      --accent-color: #ff8a5c;
      --border-color: #e2e8f0;
      --red-highlight: #ef4444;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-main: #1f2937;
        --bg-card: #273449;
        --text-primary: #f3f4f6;
        --text-secondary: #d1d5db;
        --text-muted: #9ca3af;
        --border-color: #374151;
        --red-highlight: #f87171;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 20px 18px 18px;
      background: var(--bg-main);
      color: var(--text-primary);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap:12px;
    }
    .header-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: url("./icon.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: var(--bg-card);
    }
    .header-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .github-link {
      position: relative;
      width:44px;
      height:44px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:8px;
      color: var(--text-primary);
    }
    .github-link svg {
      width:28px;
      height:28px;
      fill: currentColor;
      transform: scale(1);
      transition: transform 0.2s ease;
    }
    /* 悬停svg放大1.1倍 */
    .github-link:hover svg {
      transform: scale(1.1);
    }
    .github-link:hover {
      background-color: var(--bg-card);
    }
    /* 悬浮提示文字 */
    .github-link .tip-text {
      position: absolute;
      bottom: -24px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 12px;
      color: var(--text-secondary);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    .github-link:hover .tip-text {
      opacity: 1;
    }

    .desc {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text-secondary);
      background: var(--bg-card);
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 6px;
    }
    .desc .red-bold {
      color: var(--red-highlight);
      font-weight: 700;
    }
    .taobao-link {
      display: inline-block;
      margin-top:8px;
      font-size:13px;
      color: var(--accent-color);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .taobao-link:hover {
      opacity:0.75;
      text-decoration: underline;
    }

    .footer {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      border-top: 1px solid var(--border-color);
      padding-top: 14px;
      margin-top: 16px;
    }
  </style>
</head>
