<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通用 API 可用性检测</title>
<style>
body{font-family:Consolas,monospace;max-width:920px;margin:28px auto;padding:0 16px;background:#f7f7f9;color:#222}
h3{margin-bottom:14px}
label{font-size:13px;display:block;margin:12px 0 4px}
input{width:100%;padding:9px 11px;font-size:13.5px;border:1px solid #bbb;border-radius:8px;box-sizing:border-box;font-family:inherit}
.row{display:flex;gap:10px}
.row>div{flex:1}
button{margin-top:16px;padding:10px 30px;font-size:15px;cursor:pointer;border:0;border-radius:8px;background:#4a54e2;color:#fff}
button:disabled{opacity:.5}
#out{background:#fff;border:1px solid #ccc;border-radius:10px;padding:14px;white-space:pre-wrap;word-break:break-all;min-height:280px;font-size:13px;line-height:1.7;margin-top:16px}
.tip{font-size:12px;color:#888;margin-top:6px}
</style>
</head>
<body>

<h3>通用 API 可用性检测（OpenAI 兼容接口 · 扩展版）</h3>

<div class="row">
  <div>
    <label>Base URL（如 https://api.moonshot.cn 或 https://api.deepseek.com）</label>
    <input id="url" placeholder="https://api.moonshot.cn" value="https://api.moonshot.cn">
  </div></div>
  
  <div class="row"><div>
    <label>API Key</label>
    <input id="key" placeholder="sk-...">
  </div>
</div>
<div class="row">
  <div>
    <label>要测试对话的模型名（可选，留空则自动用列表里第一个）</label>
    <input id="model" placeholder="如 kimi-k3 / deepseek-chat">
  </div>
</div>
<div class="tip">扩展模式运行：不受浏览器跨域限制，Key 仅保存在本机，不会上传到任何第三方服务器。</div>

<button id="go">开始检测</button>
<pre id="out">填好 URL 和 Key 后点击按钮…</pre>

<script src="app.js"></script>
</body>
</html>
